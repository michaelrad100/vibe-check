# Keeps the free-tier Supabase project from pausing (7 days of inactivity) and
# alerts on failure. Runs independently of the Railway server, so restarts,
# redeploys, or a crashed container can't stop the pings. A failed run emails
# the repo owner (GitHub's default for failed scheduled workflows).
#
# Secrets: SUPABASE_URL, SUPABASE_SECRET_KEY (same values as Railway).
# Note: GitHub disables schedules in public repos after 60 days without commits;
# the monthly sample-idea refresh keeps the repo active.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 15 * * *' # daily, ~8am Pacific
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 30 \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            "$SUPABASE_URL/rest/v1/results?select=id&limit=1" > /dev/null
          echo "Supabase query OK"

      - name: Check live site health
        if: always()
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 30 \
            https://vibecheck.michaelrad.me/api/health
