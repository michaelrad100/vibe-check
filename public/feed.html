<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Check — Recent Ideas</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent-cyan: #00e5ff;
      --accent-cyan-dim: rgba(0,229,255,0.12);
      --bg-deep: #050505;
      --bg-surface: #0f0f11;
      --bg-card: #141416;
      --text-main: #e0e0e0;
      --text-muted: #888888;
      --border: #262626;
      --font-display: 'Oswald', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .feed-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-deep);
    }
    .feed-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .feed-logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-decoration: none;
      letter-spacing: 1px;
    }
    .feed-section-title {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-align: center;
      margin-bottom: 24px;
    }

    /* Grid */
    .feed-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    /* Card */
    .feed-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 20px;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.15s ease;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .feed-card:hover {
      border-color: rgba(0,229,255,0.4);
      transform: translateY(-2px);
    }
    .feed-card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .feed-grade {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-main);
    }
    .feed-grade.grade-a { border-color: #5eead4; color: #5eead4; }
    .feed-grade.grade-b { border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .feed-grade.grade-c { border-color: #c4b5a0; color: #c4b5a0; }
    .feed-grade.grade-d { border-color: #c4b5a0; color: #c4b5a0; }
    .feed-grade.grade-f { border-color: #c4b5a0; color: #c4b5a0; }
    .feed-idea {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: -0.3px;
      color: var(--text-main);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .feed-type {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      font-family: var(--font-display);
    }
    .feed-explanation {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .feed-time {
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      margin-top: auto;
    }

    /* Load more */
    .feed-load-more {
      display: block;
      margin: 32px auto 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 32px;
      font-family: var(--font-display);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .feed-load-more:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Empty state */
    .feed-empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .feed-empty a {
      color: var(--accent-cyan);
      text-decoration: none;
    }

    /* Loading */
    .feed-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .feed-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .feed-header { padding: 16px; }
      .feed-container { padding: 20px 14px; }
      .feed-grid { grid-template-columns: 1fr; }
      .feed-section-title { font-size: 12px; }
    }
  </style>
</head>
<body>

<header class="feed-header">
  <div class="feed-header-left">
    <a href="/" class="feed-logo">VC</a>
  </div>
</header>

<div class="feed-container">
  <div class="feed-section-title">Recent Ideas</div>
  <div class="feed-loading" id="feed-loading">Loading recent analyses...</div>
  <div class="feed-grid" id="feed-grid"></div>
  <button class="feed-load-more" id="load-more" style="display:none" onclick="loadMore()">Load more</button>
  <div class="feed-empty" id="feed-empty" style="display:none">
    No analyses yet. <a href="/">Run your first one &rarr;</a>
  </div>
</div>

<script>
  let offset = 0;
  const limit = 20;

  function gradeClass(g) {
    const letter = (g || '?')[0].toUpperCase();
    return { A: 'grade-a', B: 'grade-b', C: 'grade-c', D: 'grade-d', F: 'grade-f' }[letter] || '';
  }

  function humanize(str) {
    return (str || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function timeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 30) return days + 'd ago';
    return Math.floor(days / 30) + 'mo ago';
  }

  function renderCards(results) {
    const grid = document.getElementById('feed-grid');
    results.forEach(r => {
      const card = document.createElement('a');
      card.className = 'feed-card';
      card.href = '/?r=' + r.id;
      card.innerHTML = `
        <div class="feed-card-top">
          <div class="feed-grade ${gradeClass(r.grade)}">${r.grade || '?'}</div>
          <div class="feed-idea">${r.idea}</div>
        </div>
        <div class="feed-type">${humanize(r.type)}</div>
        <div class="feed-explanation">${r.explanation || ''}</div>
        <div class="feed-time">${timeAgo(r.created_at)}</div>
      `;
      grid.appendChild(card);
    });
  }

  async function loadFeed() {
    try {
      const res = await fetch(`/api/results?limit=${limit}&offset=${offset}`);
      const data = await res.json();

      document.getElementById('feed-loading').style.display = 'none';

      if (!data.results || data.results.length === 0) {
        if (offset === 0) document.getElementById('feed-empty').style.display = 'block';
        document.getElementById('load-more').style.display = 'none';
        return;
      }

      renderCards(data.results);
      offset += data.results.length;

      document.getElementById('load-more').style.display = data.hasMore ? 'block' : 'none';
    } catch (err) {
      document.getElementById('feed-loading').textContent = 'Failed to load feed.';
    }
  }

  function loadMore() {
    loadFeed();
  }

  loadFeed();
</script>
</body>
</html>
